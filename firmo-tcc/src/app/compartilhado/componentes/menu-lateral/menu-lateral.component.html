<!-- Overlay para mobile -->
<div
  class="overlay-menu-mobile"
  [class.visivel]="abertoMobile"
  (click)="fecharMobile.emit()"
></div>

<aside class="menu-lateral" [class.aberto]="abertoMobile">
  <div class="secao-navegacao">
    <div class="rotulo-menu">NAVEGAÇÃO PRINCIPAL</div>

    <ul class="lista-menu">
      <li>
        <a routerLink="/home" routerLinkActive="ativo" (click)="fecharMobile.emit()" class="item-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>Início</span>
        </a>
      </li>

      <li>
        <a routerLink="/desafios" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }" (click)="fecharMobile.emit()" class="item-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
          <span>Desafios</span>
        </a>
      </li>

      <li>
        <a routerLink="/desafios/criar" routerLinkActive="ativo" (click)="fecharMobile.emit()" class="item-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          <span>Criar Desafio</span>
        </a>
      </li>

      <li>
        <a routerLink="/validacao" routerLinkActive="ativo" (click)="fecharMobile.emit()" class="item-link item-validacao">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>Validação Árbitro</span>
          <span class="badge-pendente" *ngIf="totalPendentes > 0">{{ totalPendentes }}</span>
        </a>
      </li>

      <li>
        <a routerLink="/perfil" routerLinkActive="ativo" (click)="fecharMobile.emit()" class="item-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Meu Perfil</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Card de Compromisso no rodapé do menu lateral -->
  <div class="cartao-compromisso-sidebar">
    <div class="icone-compromisso">⚡</div>
    <h4>Compromisso Ativo</h4>
    <p>O árbitro analisa cada envio com código anti-fraude para garantir integridade.</p>
    <div class="slogan-badge">"Seu compromisso, garantido."</div>
  </div>
</aside>
