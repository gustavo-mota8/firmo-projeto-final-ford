<ng-container *ngIf="authService.isLoggedIn(); else authTemplate">
  <div class="layout-aplicacao">
    <app-cabecalho (alternarMenu)="alternarMenuMobile()"></app-cabecalho>

    <div class="corpo-aplicacao">
      <app-menu-lateral
        [abertoMobile]="menuAbertoMobile"
        (fecharMobile)="fecharMenuMobile()"
      ></app-menu-lateral>

      <main class="conteudo-principal">
        <router-outlet></router-outlet>
      </main>
    </div>

    <app-navegacao-mobile></app-navegacao-mobile>
  </div>
</ng-container>

<ng-template #authTemplate>
  <router-outlet></router-outlet>
</ng-template>
