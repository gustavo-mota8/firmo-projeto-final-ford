<header class="cabecalho-principal">
  <div class="lado-esquerdo">
    <button class="botao-menu-mobile" (click)="alternarMenu.emit()" aria-label="Abrir menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <a routerLink="/home" class="logo-firmo">
      <div class="icone-logo">
      <img src="logo-firmo.png" alt="Logo FIRMO">
      </div>
      <div class="texto-logo">
        <span class="nome-marca">FIRMO</span>
        <span class="slogan-marca">Seu compromisso, garantido.</span>
      </div>
    </a>
  </div>

  <div class="lado-direito">
    <!-- Atalho rápido para Validação (Árbitro) -->
    <a routerLink="/validacao" class="botao-arbitro-atalho" title="Painel de Validação do Árbitro">
      <span class="icone-apito">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </span>
      <span class="texto-arbitro">Árbitro</span>
      <span class="contador-pendentes" *ngIf="totalPendentes > 0">{{ totalPendentes }}</span>
    </a>

    <!-- Perfil do Usuário -->
    <a routerLink="/perfil" class="link-perfil-cabecalho" *ngIf="usuario">
      <div class="info-usuario-cabecalho">
        <span class="nome-usuario-cabecalho">{{ usuario.nome }}</span>
        <span class="pontos-usuario-cabecalho">{{ usuario.pontos }} pts</span>
      </div>
      <img [src]="usuario.avatar" [alt]="usuario.nome" class="avatar-cabecalho" />
    </a>
  </div>
</header>
